name: Setup Nix
description: Install Nix with the shared cli.sh store cache

inputs:
  cache:
    description: Use the store cache
    default: save
  purge:
    description: Purge outdated caches
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v22
      with:
        summarize: false
        extra-conf: |
          tarball-ttl = 31536000

    - name: Configure binary caches
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        read_list() {
          nix eval --raw --file config.nix "caches.$1" --apply 'builtins.concatStringsSep " "'
        }

        {
          echo "extra-substituters = $(read_list substituters)"
          echo "extra-trusted-public-keys = $(read_list trustedPublicKeys)"
        } | sudo tee -a /etc/nix/nix.conf > /dev/null

    - name: Restore Nix store cache
      if: inputs.cache == 'restore'
      uses: nix-community/cache-nix-action/restore@v7
      with:
        primary-key: nix-cli-${{ runner.os }}-${{ hashFiles('cli.sh') }}
        restore-prefixes-first-match: nix-cli-${{ runner.os }}-
        paths: |
          ~/.cache/nix

    - name: Restore and save Nix store cache
      if: inputs.cache == 'save'
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-cli-${{ runner.os }}-${{ hashFiles('cli.sh') }}
        restore-prefixes-first-match: nix-cli-${{ runner.os }}-
        paths: |
          ~/.cache/nix
        purge: ${{ inputs.purge }}
        purge-prefixes: nix-cli-${{ runner.os }}-
        purge-created: 0
        purge-primary-key: never
