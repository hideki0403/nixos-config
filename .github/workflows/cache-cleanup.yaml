name: Cache Cleanup

on:
  pull_request:
    types: [closed]

concurrency:
  group: cache-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete caches
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: write
    steps:
      - name: Delete caches created by this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail

          gh cache list --ref "$REF" --limit 100 --json key,sizeInBytes \
            --jq '.[] | "deleting \(.key) (\(.sizeInBytes) bytes)"' || true

          gh cache delete --all --ref "$REF" --succeed-on-no-caches
