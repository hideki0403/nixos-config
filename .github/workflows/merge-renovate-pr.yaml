name: Merge Renovate PR

on:
  workflow_dispatch:
    inputs:
      target:
        description: label
        type: choice
        options:
          - weekly
          - monthly
  schedule:
    - cron: '30 3 * * 6' # every Saturday 03:30 (JST)
      timezone: Asia/Tokyo
    - cron: '30 3 1 * *' # every month on the first day 3:30 (JST)
      timezone: Asia/Tokyo

concurrency:
  group: merge-renovate-pr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merge:
    name: Merge Renovate PR
    runs-on: ubuntu-latest
    steps:
      - name: Determine target
        id: target
        env:
          INPUT_TARGET: ${{ inputs.target }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_TARGET" ]; then
            target="$INPUT_TARGET"
          else
            case "$SCHEDULE" in
              '30 3 * * 6') target='weekly' ;;
              '30 3 1 * *') target='monthly' ;;
              *) echo "::error::unknown schedule: $SCHEDULE"; exit 1 ;;
            esac
          fi

          echo "target: $target"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Generate token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_HELPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_HELPER_APP_PRIVATE_KEY }}

      - name: Merge PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail

          numbers="$(gh pr list --state open --author 'app/renovate' --json number,labels --jq "
            .[]
            | select([.labels[].name] as \$labels
              | (\$labels | index(\"renovate:no-automerge\") | not) and (\$labels | index(\"renovate:$TARGET\")))
            | .number
          ")"

          if [ -z "$numbers" ]; then
            echo "no target pull requests"
            exit 0
          fi

          failed=0

          for number in $numbers; do
            echo "::group::pull request #$number"

            if ! gh pr merge "$number" --squash --auto; then
              echo "auto-merge is unavailable: falling back to a direct merge"
              gh pr merge "$number" --squash || { echo "::warning::failed to merge #$number"; failed=1; }
            fi

            echo "::endgroup::"
          done

          exit "$failed"
