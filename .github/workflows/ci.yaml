name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI_USER: ci
  CI_STATE_VERSION: "25.11"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Check flake
        run: nix flake check -L --show-trace

  discover:
    name: Discover profiles
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'renovate/') && contains(github.head_ref, 'nixos'))
    outputs:
      profiles: ${{ steps.profiles.outputs.profiles }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: List profiles
        id: profiles
        run: echo "profiles=$(./cli.sh list profiles --json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.discover.outputs.profiles) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show disk space before build
        run: df -h /

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Create user
        run: |
          ./cli.sh user --non-interactive \
            --username "$CI_USER" \
            --state-version "$CI_STATE_VERSION" \
            --password-policy none

      - name: Create host
        run: |
          ./cli.sh host --non-interactive \
            --hostname "ci-${{ matrix.profile }}" \
            --profile "${{ matrix.profile }}" \
            --users "$CI_USER" \
            --state-version "$CI_STATE_VERSION" \
            --hardware-config cli/templates/host/hardware-configuration.nix

      - name: Stage generated configuration
        run: git add -A

      - name: Build configuration
        run: nix build ".#nixosConfigurations.ci-${{ matrix.profile }}.config.system.build.toplevel" -L --show-trace

      - name: Show disk space after build
        run: df -h /
