name: Nix

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: build

env:
  CI_STATE_VERSION: "25.11"

permissions:
  contents: read

jobs:
  check:
    name: Check flake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable KVM
        if: inputs.mode == 'build'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false
          extra-conf: |
            accept-flake-config = true

      - name: Setup Cachix
        if: inputs.mode == 'build'
        uses: cachix/cachix-action@v17
        with:
          name: yukineko
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          pushFilter: '(-source$|\.tar\.gz$)'

      - name: Check flake
        run: nix flake check -L --show-trace ${{ inputs.mode == 'eval' && '--no-build' || '' }}

  discover:
    name: Discover profiles and users
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.entries.outputs.profiles }}
      users: ${{ steps.entries.outputs.users }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false
          extra-conf: |
            accept-flake-config = true

      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-discover-${{ runner.os }}-${{ hashFiles('cli.sh') }}
          restore-prefixes-first-match: nix-discover-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-discover-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts
          cache: true

      - name: List profiles and users
        id: entries
        run: |
          echo "profiles=$(./cli.sh list profiles --json)" >> "$GITHUB_OUTPUT"
          echo "users=$(./cli.sh list users --json)" >> "$GITHUB_OUTPUT"

  host:
    name: ${{ inputs.mode == 'eval' && 'Eval' || 'Build' }} (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.discover.outputs.profiles) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show disk space before build
        if: inputs.mode == 'build'
        run: df -h /

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false
          extra-conf: |
            accept-flake-config = true

      - name: Restore Nix store cache
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-discover-${{ runner.os }}-${{ hashFiles('cli.sh') }}
          restore-prefixes-first-match: nix-discover-${{ runner.os }}-

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts
          cache: true

      - name: Setup Cachix
        if: inputs.mode == 'build'
        uses: cachix/cachix-action@v17
        with:
          name: yukineko
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          pushFilter: '(-source$|\.tar\.gz$)'

      - name: Create host
        run: |
          ./cli.sh host --non-interactive \
            --hostname "ci-${{ matrix.profile }}" \
            --profile "${{ matrix.profile }}" \
            --users "${{ join(fromJSON(needs.discover.outputs.users), ',') }}" \
            --state-version "$CI_STATE_VERSION" \
            --hardware-config cli/templates/host/hardware-configuration.nix

      - name: Stage generated configuration
        run: git add -A

      - name: Evaluate configuration
        if: inputs.mode == 'eval'
        run: nix eval --raw ".#nixosConfigurations.ci-${{ matrix.profile }}.config.system.build.toplevel.drvPath" --show-trace

      - name: Build configuration
        if: inputs.mode == 'build'
        run: nix build ".#nixosConfigurations.ci-${{ matrix.profile }}.config.system.build.toplevel" -L --show-trace

      - name: Show disk space after build
        if: inputs.mode == 'build'
        run: df -h /
