name: Nix

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: build

env:
  CI_STATE_VERSION: "25.11"

permissions:
  contents: read

jobs:
  check:
    name: Check flake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable KVM
        if: inputs.mode == 'build'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false
          extra-conf: |
            accept-flake-config = true

      - name: Setup Cachix
        if: inputs.mode == 'build'
        uses: cachix/cachix-action@v17
        with:
          name: yukineko
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          pushFilter: '(-source$|\.tar\.gz$)'

      - name: Check flake
        run: nix flake check -L --show-trace ${{ inputs.mode == 'eval' && '--no-build' || '' }}

  discover:
    name: Discover profiles and users
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.entries.outputs.profiles }}
      users: ${{ steps.entries.outputs.users }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false
          extra-conf: |
            accept-flake-config = true
            tarball-ttl = 31536000

      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-cli-${{ runner.os }}-${{ hashFiles('cli.sh') }}
          restore-prefixes-first-match: nix-cli-${{ runner.os }}-
          paths: |
            ~/.cache/nix

      - name: Setup Deno
        uses: $/.github/actions/setup-deno
        with:
          install: false

      - name: List profiles and users
        id: entries
        run: |
          echo "profiles=$(./cli.sh list profiles --json)" >> "$GITHUB_OUTPUT"
          echo "users=$(./cli.sh list users --json)" >> "$GITHUB_OUTPUT"

  host:
    name: ${{ inputs.mode == 'eval' && 'Eval' || 'Build' }} (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.discover.outputs.profiles) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false
          extra-conf: |
            accept-flake-config = true
            tarball-ttl = 31536000

      - name: Restore Nix store cache
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-cli-${{ runner.os }}-${{ hashFiles('cli.sh') }}
          restore-prefixes-first-match: nix-cli-${{ runner.os }}-
          paths: |
            ~/.cache/nix

      - name: Setup Deno
        uses: $/.github/actions/setup-deno

      - name: Setup Cachix
        if: inputs.mode == 'build'
        uses: cachix/cachix-action@v17
        with:
          name: yukineko
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          pushFilter: '(-source$|\.tar\.gz$)'

      - name: Create host
        run: |
          ./cli.sh host --non-interactive \
            --hostname "ci-${{ matrix.profile }}" \
            --profile "${{ matrix.profile }}" \
            --users "${{ join(fromJSON(needs.discover.outputs.users), ',') }}" \
            --state-version "$CI_STATE_VERSION" \
            --hardware-config cli/templates/host/hardware-configuration.nix

      - name: Stage generated configuration
        run: git add -A

      - name: Evaluate configuration
        if: inputs.mode == 'eval'
        run: nix eval --raw ".#nixosConfigurations.ci-${{ matrix.profile }}.config.system.build.toplevel.drvPath" --show-trace

      - name: Build configuration
        if: inputs.mode == 'build'
        run: |
          set -euo pipefail

          nix build ".#nixosConfigurations.ci-${{ matrix.profile }}.config.system.build.toplevel" \
            --out-link result --show-trace --log-format internal-json 2>&1 >/dev/null \
            | deno run --allow-env --allow-read --allow-run --allow-write \
              .github/scripts/nix-build-report.ts result "${{ matrix.profile }}" "${{ matrix.profile }}.json"

      - name: Upload build report
        if: always() && inputs.mode == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: nix-build-report-${{ matrix.profile }}
          path: ${{ matrix.profile }}.json
          if-no-files-found: ignore
          retention-days: 1

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: host
    if: always() && inputs.mode == 'build'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: $/.github/actions/setup-deno

      - name: Download build reports
        uses: actions/download-artifact@v8
        with:
          path: reports
          pattern: nix-build-report-*
          merge-multiple: true

      - name: Write summary
        run: deno run --allow-env --allow-read --allow-write .github/scripts/nix-build-summary.ts reports
