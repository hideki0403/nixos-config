name: Deno

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts
          cache: true

      - name: Type check
        run: deno task check

  shell:
    name: Run cli.sh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false
          extra-conf: |
            accept-flake-config = true

      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-discover-${{ runner.os }}-${{ hashFiles('cli.sh') }}
          restore-prefixes-first-match: nix-discover-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-discover-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Show help
        run: ./cli.sh --help
