name: Renovate CI (NixOS build check)

on:
  pull_request:
    branches: [master]

concurrency:
  group: renovate-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Nix
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'renovate/') && contains(github.head_ref, 'nixos')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Check flake
        run: nix flake check --show-trace

      - name: Build CI configuration
        run: nix build .#nixosConfigurations.ci.config.system.build.toplevel --show-trace
